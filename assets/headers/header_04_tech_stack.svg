<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="100%" height="44" fill="none">
  <defs>
    <linearGradient id="cardBg_04_technical_arsenal" x1="0" y1="0" x2="880" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0B1226"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="cyanPill_04_technical_arsenal" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow_04_technical_arsenal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip_04_technical_arsenal">
      <rect x="0" y="0" width="880" height="44" rx="7" ry="7"/>
    </clipPath>
  </defs>
  <style>
    .title-white {
      font-family: 'JetBrains Mono', 'Segoe UI', -apple-system, BlinkMacSystemFont, monospace, sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: 0.6px;
    }
    .title-cyan {
      font-family: 'JetBrains Mono', 'Segoe UI', -apple-system, BlinkMacSystemFont, monospace, sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      fill: #00D2FF;
      letter-spacing: 0.6px;
    }
    .tag-text {
      font-family: 'JetBrains Mono', 'Segoe UI', -apple-system, BlinkMacSystemFont, monospace, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #8FA3BF;
      letter-spacing: 1.2px;
    }
    .emoji-icon {
      font-size: 17px;
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <g clip-path="url(#clip_04_technical_arsenal)">
    <rect x="0" y="0" width="880" height="44" fill="url(#cardBg_04_technical_arsenal)" stroke="#1E293B" stroke-width="1.2" rx="7"/>
    
    <!-- Left Pill Accent Bar -->
    <rect x="0" y="0" width="8" height="44" fill="url(#cyanPill_04_technical_arsenal)"/>
    
    <!-- Subtle Top Rim Glow -->
    <line x1="8" y1="1" x2="350" y2="1" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Outer Stroke Overlay -->
  <rect x="0.5" y="0.5" width="879" height="43" rx="6.5" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Top-Left Corner Accent '┌' -->
  <path d="M 22 13 L 16 13 L 16 19" fill="none" stroke="#38BDF8" stroke-width="1.3" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Emoji Icon -->
  <text x="32" y="28" class="emoji-icon">🛠️</text>

  <!-- Title: Primary (White) // Secondary (Cyan) -->
  <text x="59" y="27.5">
    <tspan class="title-white">TECHNICAL_ARSENAL</tspan>
    <tspan class="title-cyan"> // TECH_STACK_MATRIX</tspan>
  </text>

  <!-- Right System Identifier Tag + Cyan Beacon Dot -->
  <g transform="translate(860, 0)">
    <text x="-16" y="27.5" text-anchor="end" class="tag-text">SYS.TECH_MATRIX</text>
    <circle cx="-3" cy="23.5" r="4" fill="#00D2FF" filter="url(#glow_04_technical_arsenal)"/>
    <circle cx="-3" cy="23.5" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>