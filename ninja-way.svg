<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="Rules of the Death Note — Code Edition">
<title>Rules of the Death Note — Code Edition</title>
<desc>How to use it — Code Edition. Full Stack &amp; Web3 Engineer with 5 industry internships by day, mastermind builder by night.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');

.title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
.quote { font-family: 'Playfair Display', Georgia, serif; font-style: italic; }
.sg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.jbx { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 800; }
.jb { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
.desc { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 500; }

@keyframes pulseDot {
  0%, 100% { opacity: .95; transform: scale(1); }
  50% { opacity: .35; transform: scale(1.2); }
}
@keyframes starPulse {
  0%, 100% { opacity: .65; transform: rotate(0deg); }
  50% { opacity: 1; transform: rotate(45deg); }
}
@keyframes glowL {
  0%, 100% { fill-opacity: .10; }
  50% { fill-opacity: .20; }
}
.p-dot {
  transform-box: fill-box;
  transform-origin: center;
  animation: pulseDot 2s ease-in-out infinite;
}
.gothic-l {
  animation: glowL 3.5s ease-in-out infinite;
}
.star-icon {
  transform-box: fill-box;
  transform-origin: center;
  animation: starPulse 4s ease-in-out infinite;
}
</style>
</defs>

