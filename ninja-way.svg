<!-- Subtle red underline accent beneath 'Code Edition' -->
<path d="M228 106 Q280 103 332 106" fill="none" stroke="#ff1e42" stroke-width="2" stroke-linecap="round" stroke-opacity=".6"/>

<text class="sg" x="24" y="126" font-size="13" font-weight="600" fill="#94a3b8">Full Stack &amp; Web3 Engineer with 5 industry internships by day, mastermind builder by night.</text>

